name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  PYTHON_VERSIONS: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'

jobs:
  vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-versions: ${{ env.PYTHON_VERSIONS }}
      lint-python-version: ${{ steps.lint-python-version.outputs.version }}
    steps:
      - id: lint-python-version
        run: echo "version=$(jq -r '.[-2]' <<< "$PYTHON_VERSIONS")" >> "$GITHUB_OUTPUT"

  test:
    needs: vars
    name: test w/ Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.vars.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install nox
      - run: nox --session tests-"$PYTHON_VERSION"
        env:
          PYTHONDEVMODE: 1
          PYTHON_VERSION: ${{ matrix.python-version }}
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  lint:
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ needs.vars.outputs.lint-python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install nox
      - run: nox --session lint
